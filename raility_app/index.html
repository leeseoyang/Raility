<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<meta name="description" content="국가철도공단 공공데이터로 내 통근 경로의 단일고장점을 진단합니다. 어느 역이 멈추면 우회할 수 없는지 알려주는 도시철도 취약성 진단 서비스.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raility">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
<title>Raility · 도시철도 취약성 진단</title>
</head>
<body>

<header class="appbar">
  <h1>Raility</h1>
  <span class="sub">도시철도 취약성 진단</span>
  <span class="spacer"></span>
  <button class="region-btn" id="regionBtn" aria-label="검색 기준 권역 변경">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <span id="regionLabel">수도권</span>
  </button>
</header>

<!-- ── 진단 ─────────────────────────────────────────────── -->
<main class="view on" data-view="diagnose">
  <div class="eyebrow">경로 진단</div>

  <div class="od-wrap">
    <div class="od">
      <button class="od-row" id="odFromBtn">
        <span class="od-dot from"></span>
        <span class="od-label">출발</span>
        <span class="od-name empty" id="odFrom">출발역 선택</span>
      </button>
      <button class="od-row" id="odToBtn">
        <span class="od-dot to"></span>
        <span class="od-label">도착</span>
        <span class="od-name empty" id="odTo">도착역 선택</span>
      </button>
    </div>
    <button class="od-swap" id="odSwap" aria-label="출발역과 도착역 바꾸기">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3v18"/><path d="m3 7 4-4 4 4"/><path d="M17 21V3"/><path d="m13 17 4 4 4-4"/>
      </svg>
    </button>
  </div>

  <p class="note" style="margin:12px 2px 0">
    지도 앱은 지금 다니는 길을 알려줍니다. 이 앱은 <b>그 길 위 어느 역 하나가 멈추면 돌아갈 수 있는지</b>를 계산합니다.
  </p>

  <div id="result"></div>
</main>

<!-- ── 지도 ─────────────────────────────────────────────── -->
<main class="view" data-view="map">
  <div class="eyebrow">취약구간 지도</div>
  <div class="segbar" id="mapRegions"></div>
  <p class="note" id="mapStat" style="margin:10px 2px 10px"></p>
  <div id="map"></div>
  <div class="map-legend">
    <span><i style="background:var(--risk-3)"></i>끊기면 망이 분리되는 구간·역</span>
    <span><i style="background:var(--surface);border:2px solid var(--ink-1)"></i>환승역</span>
    <span><i style="background:var(--ink-5)"></i>환승 연결</span>
  </div>
  <p class="note" style="margin:12px 2px 0">
    원의 크기는 일평균 승하차 규모입니다. 두 손가락으로 확대하거나 끌어서 이동할 수 있고, 역을 누르면 상세가 열립니다.
  </p>
</main>

<!-- ── 대전 ─────────────────────────────────────────────── -->
<main class="view" data-view="daejeon" id="viewDaejeon"></main>

<!-- ── 데이터 ───────────────────────────────────────────── -->
<main class="view" data-view="data" id="viewData"></main>

<!-- ── 하단 탭 ──────────────────────────────────────────── -->
<nav class="tabbar" role="tablist">
  <button class="tab" data-tab="diagnose" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>진단
  </button>
  <button class="tab" data-tab="map" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 19-6-3-6 3V6l6-3 6 3 6-3v13l-6 3Z"/><path d="M9 3v13"/><path d="M15 6v13"/>
    </svg>지도
  </button>
  <button class="tab" data-tab="daejeon" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M11 11v7"/><path d="M15 7v11"/><path d="M19 12v6"/>
    </svg>권역
  </button>
  <button class="tab" data-tab="data" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </svg>데이터
  </button>
</nav>

<!-- ── 검색 시트 ────────────────────────────────────────── -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet-panel">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle">역 선택</h3>
      <button id="sheetClose">닫기</button>
    </div>
    <div class="search" id="searchWrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-4)" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="searchInput" type="search" placeholder="역 이름 검색" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/graph.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
